stages: [validate, sync, deploy]
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'

# Replace with your tested image, reachable by both runners. This placeholder
# resolves nowhere on purpose: a forgotten replacement must fail at once rather
# than run something unintended.
default:
  image:
    name: registry.example.com/ansible-controller:REPLACE-ME
    entrypoint: [""]

validate:
  stage: validate
  tags: [mesh-validate]
  script:
    - ansible-playbook --syntax-check -i inventory/validation/hosts.ini playbooks/site.yml
    - ansible-lint playbooks/site.yml
    - python3 -m unittest discover -s tests

.controller-job:
  tags: [mesh-deploy]
  resource_group: automation-production
  environment:
    name: prod-direct
  before_script:
    # Name the missing configuration instead of failing inside chmod or ssh.
    - for v in CTL_SSH_KEY CTL_KNOWN_HOSTS CTL_HOST; do eval "test -n \"\${$v:-}\"" || { echo "$v is not set - add the protected variables from the README connection checklist"; exit 2; }; done
    - chmod 600 "$CTL_SSH_KEY"
    - CTL_COMMIT_SHA=$(/usr/bin/git --git-dir="$(pwd -P)/.git" rev-parse --verify HEAD)
  artifacts:
    when: always
    access: maintainer
    expire_in: 7 days
    paths: [mesh-artifacts/, reports/]
    reports:
      junit: reports/deployment.xml

# Review/merge approves the code before this non-executing controller fetch.
# To require a separate human release here, add when: manual and
# allow_failure: false to the sync rule. Deploy remains manual in either mode.
sync:
  extends: .controller-job
  stage: sync
  environment:
    name: prod-direct
    action: prepare
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v/'
  script:
    - bash scripts/deploy.sh --sync-only --env prod-direct --project "$CI_PROJECT_PATH" --sha "$CTL_COMMIT_SHA"
        --playbook playbooks/site.yml --pipeline "$CI_PIPELINE_ID" --job "$CI_JOB_ID" --wait 120

deploy:
  extends: .controller-job
  stage: deploy
  needs:
    - job: sync
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG =~ /^v/'
      when: manual
      allow_failure: false
  script:
    - bash scripts/deploy.sh --execute-synced --env prod-direct --project "$CI_PROJECT_PATH" --sha "$CTL_COMMIT_SHA"
        --playbook playbooks/site.yml --pipeline "$CI_PIPELINE_ID" --job "$CI_JOB_ID" --wait 120
