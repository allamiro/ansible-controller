<svg id="my-svg" width="386.33203125" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="686" viewBox="-8 -8 386.33203125 686" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg" style="background-color: white;"><title id="chart-title-my-svg">Platform and project lifecycle</title><desc id="chart-desc-my-svg">Administrators prepare runtime, trust and environment permissions. Project authors then create and validate content, obtain review, sync a fixed commit, release execution and inspect results. Runtime changes follow a separate tested upgrade path.</desc><style>#my-svg{font-family:Arial,sans-serif;font-size:16px;fill:#172b4d;}#my-svg .error-icon{fill:#f8fafc;}#my-svg .error-text{fill:#070503;stroke:#070503;}#my-svg .edge-thickness-normal{stroke-width:2px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#506580;stroke:#506580;}#my-svg .marker.cross{stroke:#506580;}#my-svg svg{font-family:Arial,sans-serif;font-size:16px;}#my-svg .label{font-family:Arial,sans-serif;color:#172b4d;}#my-svg .cluster-label text{fill:#070503;}#my-svg .cluster-label span,#my-svg p{color:#070503;}#my-svg .label text,#my-svg span,#my-svg p{fill:#172b4d;color:#172b4d;}#my-svg .node rect,#my-svg .node circle,#my-svg .node ellipse,#my-svg .node polygon,#my-svg .node path{fill:#eef4ff;stroke:#4972a7;stroke-width:1px;}#my-svg .flowchart-label text{text-anchor:middle;}#my-svg .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#my-svg .node .label{text-align:center;}#my-svg .node.clickable{cursor:pointer;}#my-svg .arrowheadPath{fill:#0b0b0b;}#my-svg .edgePath .path{stroke:#506580;stroke-width:2.0px;}#my-svg .flowchart-link{stroke:#506580;fill:none;}#my-svg .edgeLabel{background-color:#ffffff;text-align:center;}#my-svg .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#my-svg .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#my-svg .cluster rect{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1px;}#my-svg .cluster text{fill:#070503;}#my-svg .cluster span,#my-svg p{color:#070503;}#my-svg div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Arial,sans-serif;font-size:12px;background:#f8fafc;border:1px solid hsl(210, 0%, 88.0392156863%);border-radius:2px;pointer-events:none;z-index:100;}#my-svg .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#172b4d;}#my-svg .edgeLabel rect{opacity:1!important;}#my-svg :root{--mermaid-font-family:Arial,sans-serif;}#my-svg .platform rect{fill:rgb(238, 244, 255)!important;stroke:rgb(73, 114, 167)!important;color:rgb(23, 43, 77)!important;}#my-svg .platform polygon{fill:rgb(238, 244, 255)!important;stroke:rgb(73, 114, 167)!important;color:rgb(23, 43, 77)!important;}#my-svg .platform ellipse{fill:rgb(238, 244, 255)!important;stroke:rgb(73, 114, 167)!important;color:rgb(23, 43, 77)!important;}#my-svg .platform circle{fill:rgb(238, 244, 255)!important;stroke:rgb(73, 114, 167)!important;color:rgb(23, 43, 77)!important;}#my-svg .platform path{fill:rgb(238, 244, 255)!important;stroke:rgb(73, 114, 167)!important;color:rgb(23, 43, 77)!important;}#my-svg .platform tspan{fill:rgb(23, 43, 77)!important;}#my-svg .project rect{fill:rgb(237, 248, 242)!important;stroke:rgb(61, 129, 100)!important;color:rgb(20, 59, 43)!important;}#my-svg .project polygon{fill:rgb(237, 248, 242)!important;stroke:rgb(61, 129, 100)!important;color:rgb(20, 59, 43)!important;}#my-svg .project ellipse{fill:rgb(237, 248, 242)!important;stroke:rgb(61, 129, 100)!important;color:rgb(20, 59, 43)!important;}#my-svg .project circle{fill:rgb(237, 248, 242)!important;stroke:rgb(61, 129, 100)!important;color:rgb(20, 59, 43)!important;}#my-svg .project path{fill:rgb(237, 248, 242)!important;stroke:rgb(61, 129, 100)!imp