name: Build & Publish (Docker Hub + GHCR)

# Publishes three images per registry (Docker Hub + GHCR), same tag set each:
#   ansible-controller      — docker/Dockerfile (unchanged, the original pipeline)
#   ansible-orchestrator    — docker/mesh/Dockerfile --target orchestrator
#   ansible-execution-node  — docker/mesh/Dockerfile --target execution-node
# The mesh images build FROM the controller digest pushed by the SAME run, so a
# release is internally consistent by construction: an orchestrator tagged
# vX.Y.Z is provably layered on the controller tagged vX.Y.Z, never on whatever
# `latest` happened to point at (mesh plan Phase 11 — extend the matrix, don't
# fork it).

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  # Each platform builds natively (no QEMU emulation — arm64 under QEMU was ~5x
  # slower). Non-PR builds push by digest; the merge job stitches the digests
  # into one multi-arch manifest list per registry and applies the tags.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - name: Validate required secrets
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret is not configured"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Docker Hub image only on non-PR events (push, tag, manual dispatch):
          # PR runs (Dependabot, forks) have no secrets, and an empty username
          # yields an invalid "docker.io//..." tag
          images: |
            ${{ github.event_name != 'pull_request' && format('docker.io/{0}/ansible-controller', secrets.DOCKERHUB_USERNAME) || '' }}
            ghcr.io/${{ github.repository_owner }}/ansible-controller

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR validation, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.platform }}

      - name: Build and push by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.platform }}
          outputs: type=image,"name=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ansible-controller,ghcr.io/${{ github.repository_owner }}/ansible-controller",push-by-digest=true,name-canonical=true,push=true

      # ---- mesh images: orchestrator + execution-node (mesh plan Phase 11) ----
      # Built FROM the controller digest THIS run just pushed to GHCR — an
      # immutable base, so docker/mesh/Dockerfile's digest-pin guard passes with
      # no ALLOW_MUTABLE_BASE escape and the published mesh images are
      # reproducible for a given controller. PR runs skip them: a PR pushes no
      # controller digest to pin to, and mesh-image.yml already builds, smokes,
      # and Trivy-gates both targets on every mesh PR.
      - name: Build and push orchestrator by digest
        if: github.event_name != 'pull_request'
        id: build-orchestrator
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/mesh/Dockerfile
          target: orchestrator
          build-args: |
            BASE=ghcr.io/${{ github.repository_owner }}/ansible-controller@${{ steps.build.outputs.digest }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mesh-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=mesh-${{ matrix.platform }}
          outputs: type=image,"name=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ansible-orchestrator,ghcr.io/${{ github.repository_owner }}/ansible-orchestrator",push-by-digest=true,name-canonical=true,push=true

      - name: Build and push execution-node by digest
        if: github.event_name != 'pull_request'
        id: build-execution-node
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/mesh/Dockerfile
          target: execution-node
          build-args: |
            BASE=ghcr.io/${{ github.repository_owner }}/ansible-controller@${{ steps.build.outputs.digest }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mesh-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=mesh-${{ matrix.platform }}
          outputs: type=image,"name=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ansible-execution-node,ghcr.io/${{ github.repository_owner }}/ansible-execution-node",push-by-digest=true,name-canonical=true,push=true

      # One subdirectory per image: the merge job reassembles per-image manifest
      # lists from these, so the digests must stay attributable to their image.
      - name: Export digests
        if: github.event_name != 'pull_request'
        run: |
          base="${{ runner.temp }}/digests"
          mkdir -p "$base/controller" "$base/orchestrator" "$base/execution-node"
          d="${{ steps.build.outputs.digest }}";                touch "$base/controller/${d#sha256:}"
          d="${{ steps.build-orchestrator.outputs.digest }}";   touch "$base/orchestrator/${d#sha256:}"
          d="${{ steps.build-execution-node.outputs.digest }}"; touch "$base/execution-node/${d#sha256:}"

      - name: Upload digests
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/digests/**
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # 15 sufficed for one image; the job now stitches, signs, and Trivy-scans
    # three per registry, and the backstop scan alone can take a few minutes
    # per image on a cold DB.
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing via GitHub OIDC
      actions: read     # read the Auto-tag run's status (see Resolve release version)

    steps:
      - uses: actions/checkout@v7   # .trivyignore, and the tag lookup below
        with:
          fetch-depth: 0   # tags are not fetched by a shallow clone

      # auto-tag.yml creates the vX.Y.Z tag, but pushes it with GITHUB_TOKEN — and
      # GitHub does not start workflow runs from events created by that token. So this
      # workflow's `on: push: tags` trigger has never fired, and the type=semver tags
      # below were never applied: only latest/main/sha-* exist in the registries, for
      # this release and every one before it. Resolving the tag here puts them on the
      # run that does happen.
      #
      # auto-tag.yml runs as a separate workflow on this same push, so wait on its run
      # reaching a terminal state rather than polling for the tag on a timer. A fixed
      # window does not resolve the race, it only usually wins it: a queued runner can
      # push the tag after the window closes, and because that push carries
      # GITHUB_TOKEN it can never trigger a publish of its own — so the release would
      # be stuck at latest/sha-* permanently, silently. Waiting for the run means the
      # only way to see no tag is that auto-tag finished and produced none.
      #
      # GitHub creates the run record at push time even when the runner is queued, so
      # a run that has not appeared within a minute is a push auto-tag skipped
      # (paths-ignore) rather than one that is merely slow. Either way, publish
      # latest/sha-* without semver tags rather than failing a release over a tag that
      # was never going to exist.
      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=""
          for _ in $(seq 1 12); do
            run_id="$(gh run list --workflow auto-tag.yml --commit "$GITHUB_SHA" \
                        --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$run_id" ] && break
            sleep 5
          done

          if [ -n "$run_id" ]; then
            echo "Waiting for Auto-tag run ${run_id}"
            gh run watch "$run_id" --exit-status >/dev/null 2>&1 \
              || echo "::warning::Auto-tag run ${run_id} did not succeed; resolving whatever tag exists"
          else
            echo "::notice::no Auto-tag run for ${GITHUB_SHA} (push it skips); no version tag expected"
          fi

          git fetch --tags --force --quiet
          version="$(git tag --points-at "$GITHUB_SHA" --list 'v*.*.*' --sort=-v:refname | head -1)"
          if [ -n "$version" ]; then
            echo "Publishing version ${version}"
          else
            echo "::notice::no v*.*.* tag on ${GITHUB_SHA}; publishing latest/sha tags only"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ansible-controller
            ghcr.io/${{ github.repository_owner }}/ansible-controller
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ansible-orchestrator
            ghcr.io/${{ github.repository_owner }}/ansible-orchestrator
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ansible-execution-node
            ghcr.io/${{ github.repository_owner }}/ansible-execution-node
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest lists
        working-directory: ${{ runner.temp }}/digests
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # <digest subdirectory> <published image name> — each image's manifest
          # list is stitched only from the digests its own builds exported.
          for pair in \
            "controller ansible-controller" \
            "orchestrator ansible-orchestrator" \
            "execution-node ansible-execution-node"; do
            set -- $pair; dir="$1"; name="$2"
            for image in \
              "docker.io/${DOCKERHUB_USERNAME}/${name}" \
              "ghcr.io/${{ github.repository_owner }}/${name}"; do
              tags=$(jq -cr --arg img "$image" \
                '.tags | map(select(startswith($img + ":")) | "-t " + .) | join(" ")' \
                <<< "$DOCKER_METADATA_OUTPUT_JSON")
              # Digest files live under per-image subdirectories, so only each
              # file's BASENAME is the digest — the glob path itself would
              # produce invalid "@sha256:controller/<hash>" references.
              # $tags and the digest list are intentionally word-split
              # shellcheck disable=SC2046,SC2086
              docker buildx imagetools create $tags \
                $(for f in "${dir}"/*; do printf "%s@sha256:%s " "$image" "${f##*/}"; done)
            done
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign published manifests (keyless OIDC)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          tag="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          for name in ansible-controller ansible-orchestrator ansible-execution-node; do
            for image in \
              "docker.io/${DOCKERHUB_USERNAME}/${name}" \
              "ghcr.io/${{ github.repository_owner }}/${name}"; do
              digest=$(docker buildx imagetools inspect "${image}:${tag}" \
                --format '{{.Manifest.Digest}}')
              cosign sign --yes "${image}@${digest}"
            done
          done

      # Backstop, not the primary gate: by the time this runs the manifest is already
      # pushed and tagged, so a failure here means "a published image regressed, go pull
      # the tag" rather than "the bad image was stopped". The gate that actually blocks a
      # regression is the same scan in docker-image.yml, which runs against a PR build
      # with push: false. This one still fails loudly — it previously ran with
      # --exit-code 0 and scrolled past in a green run, which is how a scanner stops
      # being a signal. See docker-image.yml for why --ignore-unfixed.
      - name: Fail on CRITICAL/HIGH CVEs in the published images (Trivy)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          tag="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          for name in ansible-controller ansible-orchestrator ansible-execution-node; do
            trivy image \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 1 \
              --timeout 10m \
              "ghcr.io/${{ github.repository_owner }}/${name}:${tag}"
          done
