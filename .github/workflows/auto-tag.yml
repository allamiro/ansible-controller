name: Auto-tag

# Runs after every push to main that changes actual code or config.
# Pure documentation changes (README, issue templates, LICENSE, the Docker Hub
# overviews under .github/dockerhub/) are excluded so they don't generate a new
# image version. docker-publish.yml has no such filter, so an overview-only
# push still syncs the Hub page — as latest/sha-* only, with no new release.
#
# Bump rules (conventional commits):
#   feat!: / BREAKING CHANGE  →  major  (v1.0.0 → v2.0.0)
#   feat:                      →  minor  (v1.0.0 → v1.1.0)
#   fix: / perf: / refactor:   →  patch  (v1.0.0 → v1.0.1)
#   anything else              →  patch  (default)
#
# The versioned image and the GitHub Release both come from THIS push to main, not
# from the tag. The tag is pushed with GITHUB_TOKEN, and GitHub does not start
# workflow runs from events created by that token — so a `push: tags` trigger never
# fires. The Release is created by the step below; docker-publish.yml runs on this
# same push, waits for this workflow's run, reads the tag it created, and applies the
# versioned image tags. (A dedicated release.yml keyed on `push: tags` used to sit
# alongside this and never ran once, for the same GITHUB_TOKEN reason; it was removed.)

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/dockerhub/**"

jobs:
  tag:
    name: Bump version and push tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history needed to find previous tag

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: v

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
          make_latest: true

      - name: Summary
        run: |
          echo "Previous version : ${{ steps.tag.outputs.previous_tag }}"
          echo "New version      : ${{ steps.tag.outputs.new_tag }}"
          echo "Changelog        :"
          echo "${{ steps.tag.outputs.changelog }}"
