name: CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - ".trivyignore"
      - ".github/workflows/docker-image.yml"
  push:
    branches: ["main"]
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - ".trivyignore"

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: error

  # Mirrors the publish matrix in docker-publish.yml: each architecture is built
  # natively and gated on its own. Scanning only amd64 would let an arm64-only
  # CRITICAL/HIGH — a different base-image package set, or an arch-specific binary
  # like msgpack's compiled extension — pass the gate and still get published.
  # Native runners for the same reason as the publish workflow: arm64 under QEMU
  # was ~5x slower.
  build-and-test:
    name: Build and smoke-test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ansible-controller:ci
          # scoped per arch — a shared cache scope would have the two runners
          # evicting each other's layers every run
          cache-from: type=gha,scope=ci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.arch }}
      - name: Smoke test
        run: |
          docker run -d --name ci-smoke ansible-controller:ci
          sleep 5
          docker exec ci-smoke ansible --version
          docker exec ci-smoke pgrep sshd
          docker rm -f ci-smoke

      # The gate that makes a CVE fix verifiable before it is merged. This image is
      # built with push: false, so a regression caught here never reaches a registry —
      # unlike the scan in docker-publish.yml, which can only report after the manifest
      # is already public.
      #
      # --ignore-unfixed: fail only on findings that can actually be acted on. Without
      # it, a newly disclosed HIGH with no upstream patch yet would block every merge
      # until the distro caught up, with nothing a change here could do about it.
      # Accepted risks belong in .trivyignore, with a justification and an expiry.
      - name: Fail on CRITICAL/HIGH CVEs (Trivy)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --timeout 10m \
            ansible-controller:ci
