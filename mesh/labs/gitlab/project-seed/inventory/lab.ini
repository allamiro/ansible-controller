# The lab's isolated target — reachable ONLY from the execution node
# (mesh-e2e-node-a straddles ctlnet and targetnet; the orchestrator has no
# route). Host-key checking is disabled because the target's host key is
# generated fresh on every lab build; production uses the README's
# known-hosts procedure instead.
mesh-e2e-target ansible_user=ansible ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
