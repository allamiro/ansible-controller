# Standalone-mode target: reachable DIRECTLY from the controller (they share
# the lab's directnet). Host-key checking is relaxed in the lab because the
# target's host key is generated fresh on every build; production standalone
# runs use the main README's known-hosts procedure.
direct-target ansible_user=ansible ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
