# Windows targets over WinRM — CONFIGURED EXAMPLE. The lab has no Windows
# host, so executing against this inventory is explicitly untested here;
# the transport (pywinrm/NTLM) is present in both the controller and the
# execution-node images.
#
# PRODUCTION SHAPE (preferred): HTTPS with real certificate + hostname
# validation. The CA that signed the WinRM listener's certificate must be
# trusted WHERE ANSIBLE RUNS — the controller for standalone, the execution
# node for mesh (a site-extended node image carrying the CA bundle).
[windows]
win1 ansible_host=win1.dmz.example.com

[windows:vars]
ansible_connection=winrm
ansible_port=5986
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=validate
# Credentials never live in this file: reference Vault-encrypted variables
# (group_vars/windows/vault.yml). For mesh runs note --ssh-key does NOT
# carry WinRM or Vault secrets — the vault password must be provisioned to
# the runtime that executes the play (see ARCHITECTURE.md, WinRM section).
# ansible_user / ansible_password -> from Vault.
ansible_become=false

# HTTP (5985) is a separate, weaker mode: no TLS certificate verification.
# NTLM/Kerberos still message-encrypt the payload; Basic over HTTP sends
# credentials effectively in the clear and must not be used.
