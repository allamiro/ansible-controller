# Git-managed Ansible automation — GitLab as the everyday interface.
#
# Two invocation channels exist side by side, both behind the SAME protected-
# ref gate (the lab-deploy runner accepts protected refs only):
#   - SSH channel (deploy-* jobs): the job holds no mesh authority at all; it
#     SSHes to the controller (key in a protected file variable, host key
#     PINNED in CTL_KNOWN_HOSTS) and invokes ctl-run, which fetches THIS
#     project at $CI_COMMIT_SHA from GitLab and executes it. The environment
#     map on the controller — not this file — decides mode, destination,
#     inventory, and credentials.
#   - Recovery (collect) invokes ctl-run over the same SSH channel; no job
#     container needs mesh sockets or state volumes.
#
# CE governance (verified): approvals are optional in CE; the enforced gate
# is protected main + pipelines-must-succeed + protected runner/variables +
# these manual buttons. resource_group serializes THIS project's deploy/
# collect jobs; ctl-run's per-environment lock serializes across everything
# else that could reach the controller.

stages: [validate, deploy, collect]

workflow:
  rules:
    # schedule/trigger/tag first: the duplicate-suppression rule below must
    # only kill PUSH pipelines that have an MR twin, never these sources
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

validate:
  stage: validate
  tags: [mesh-validate]
  image:
    name: ansible-controller:e2e
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
  script:
    - ansible-playbook --syntax-check -i inventory/lab.ini playbooks/site.yml playbooks/ping.yml
    - ansible-lint playbooks/ || { echo "ansible-lint findings above"; exit 1; }

# ---- SSH channel to the controller ------------------------------------------
.ctl-ssh:
  tags: [mesh-deploy]                   # protected runner: protected refs only
  image:
    name: ansible-controller:e2e
    entrypoint: [""]
  resource_group: mesh-lab
  before_script:
    - chmod 600 "$CTL_SSH_KEY"
    - CTL="ssh -i $CTL_SSH_KEY -o UserKnownHostsFile=$CTL_KNOWN_HOSTS -o StrictHostKeyChecking=yes -o BatchMode=yes ansible@${CTL_HOST:-ctl.lab.local}"

# routine execution after review: merge to protected main, human releases
deploy-mesh:
  extends: .ctl-ssh
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  environment: { name: lab-mesh }
  variables: { PLAYBOOK: playbooks/site.yml }
  script:
    - $CTL ctl-run --env lab-mesh --project "$CI_PROJECT_PATH" --sha "$CI_COMMIT_SHA"
        --playbook "$PLAYBOOK" --pipeline "$CI_PIPELINE_ID" --job "$CI_JOB_ID" --wait 120

deploy-direct:
  extends: .ctl-ssh
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  environment: { name: lab-direct }
  variables: { PLAYBOOK: playbooks/site.yml }
  script:
    - $CTL ctl-run --env lab-direct --project "$CI_PROJECT_PATH" --sha "$CI_COMMIT_SHA"
        --playbook "$PLAYBOOK" --pipeline "$CI_PIPELINE_ID" --job "$CI_JOB_ID"

# scheduled connectivity check (create the schedule in CI/CD > Schedules)
scheduled-check:
  extends: .ctl-ssh
  stage: deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  environment: { name: lab-mesh }
  script:
    - $CTL ctl-run --env lab-mesh --project "$CI_PROJECT_PATH" --sha "$CI_COMMIT_SHA"
        --playbook playbooks/ping.yml --pipeline "$CI_PIPELINE_ID" --job "$CI_JOB_ID" --wait 90

# API-triggered execution: needs the trigger token AND the explicit consent
# variable — a trigger without DEPLOY_CONFIRM=yes creates no deploy job.
api-deploy:
  extends: .ctl-ssh
  stage: deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $DEPLOY_CONFIRM == "yes"
  environment: { name: lab-mesh }
  variables: { PLAYBOOK: playbooks/site.yml }
  script:
    - $CTL ctl-run --env lab-mesh --project "$CI_PROJECT_PATH" --sha "$CI_COMMIT_SHA"
        --playbook "$PLAYBOOK" --pipeline "$CI_PIPELINE_ID" --job "$CI_JOB_ID" --wait 120

# protected-tag releases: same channel, released ref. Requires the tag
# PATTERN to be protected (bootstrap protects v* — an unprotected tag can
# never reach the ref_protected deploy runner).
tag-deploy:
  extends: .ctl-ssh
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  environment: { name: lab-mesh }
  variables: { PLAYBOOK: playbooks/site.yml }
  script:
    - $CTL ctl-run --env lab-mesh --project "$CI_PROJECT_PATH" --sha "$CI_COMMIT_SHA"
        --playbook "$PLAYBOOK" --pipeline "$CI_PIPELINE_ID" --job "$CI_JOB_ID" --wait 120

# Recovery uses the same controller boundary as dispatch. Unknown-unit/stale
# administrative reconciliation remains an operator procedure on the controller.
collect:
  extends: .ctl-ssh
  stage: collect
  environment: { name: lab-mesh }
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  script:
    - test -n "$JOB_ID" || { echo "Set JOB_ID to the existing mesh UUID"; exit 2; }
    - $CTL ctl-run --collect "$JOB_ID"
