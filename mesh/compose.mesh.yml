# Mesh overlay — distributed-execution control plane (mesh plan Phase 3).
#
#   docker compose -f docker-compose.yml -f mesh/compose.mesh.yml \
#     --profile mesh up -d
#
# `make up` runs plain `docker compose up -d`, which never passes this file, so
# the controller's default behaviour is untouched (mesh plan §1, guarantee 2).
#
# Precisely what each half does, since the two are often conflated:
#   * Passing -f mesh/compose.mesh.yml merges the `ansible:` block below, which
#     adds the receptor-runtime mount to the controller and declares the volume.
#     No mesh container is created and nothing new runs.
#   * Adding --profile mesh is what creates the receptor-controller sidecar.
# So the overlay is not literally inert when loaded alone — it is the profile that
# gates the sidecar. A volume mount cannot itself carry `profiles:`; if the
# controller must be bit-identical, omit the -f instead, which is exactly what
# `make up` does.
# Relative paths below resolve from the project directory — the repo root, since
# docker-compose.yml is the first -f file — not from mesh/.

services:
  # The controller gains ONE thing: a mount of the shared socket volume, so a
  # process inside it can reach the receptor control socket. Image, ports, and
  # every other mount still come from docker-compose.yml; Compose merges volumes
  # by target path, so nothing there is replaced.
  #
  # The controller image has no receptorctl yet — Phase 5 points this service at
  # the orchestrator image (controller + ansible-runner + receptorctl) and starts
  # dispatching. Phase 3 only proves the plumbing.
  ansible:
    volumes:
      - receptor-runtime:/run/receptor

  # TWO sidecars, A and B — Tier-1 ingress redundancy (§9.7). Execution nodes
  # peer to both; the orchestrator's dispatcher tries A's control socket first
  # and fails over to B's. mTLS material comes from mesh/secrets/receptor/
  # (populated by mesh/pki/, never committed): each sidecar mounts ITS OWN
  # issued identity plus the CA cert — and never the CA key (plan §4).
  receptor-controller:
    # Opt-in only: without `--profile mesh` this service is never created, so
    # `docker compose up` on the overlay still starts the controller alone.
    profiles: [mesh]
    # Pinned by digest as well as tag: a tag is a mutable pointer, and the mesh's
    # ingress is not something to re-base implicitly on a rebuild. v1.6.7 matches
    # the receptorctl pinned in docker/mesh/Dockerfile — receptor and receptorctl
    # are released together and should be upgraded together.
    #
    # The digest is the MULTI-ARCH index digest (linux/amd64 + linux/arm64 +
    # linux/ppc64le), not a single-arch manifest, so this same pin runs natively
    # on amd64 and arm64 control hosts — matching the two architectures the
    # controller itself is built for. Verify when bumping the pin:
    #   docker buildx imagetools inspect quay.io/ansible/receptor:vX.Y.Z
    # and take the top-level "Digest:" line (the index), never a per-platform
    # manifest digest from the list below it.
    image: quay.io/ansible/receptor:v1.6.7@sha256:6296f6cd3b0301cc7c9376e48ae15a42fc7b606235d08e94543fe77661cea4d2
    container_name: receptor-controller
    restart: unless-stopped
    # Execution nodes in other networks dial this listener from outside the
    # compose network, so it must be published on the host. Safe to expose:
    # the listener requires a client certificate from the mesh CA before any
    # peer is accepted (tls-server: requireclientcert), and the control socket
    # stays a unix socket that is never network-reachable.
    ports:
      - "27199:27199"
    volumes:
      # Staged read-only, then installed into place by the command below.
      - ./mesh/config/receptor/controller-a.yml:/mnt/receptor/receptor.conf:ro
      - ./mesh/secrets/receptor/issued/controller-a:/mnt/receptor/tls:ro
      - receptor-runtime:/run/receptor
    # Two startup problems are solved here, both as root, before the long-lived
    # process drops back to the image's unprivileged receptor user:
    #
    #  1. A fresh named volume is created root-owned 0755, so uid 998 cannot
    #     create its socket inside it. Root prepares the directory first.
    #  2. The config is COPIED in rather than read from the bind mount. A checkout
    #     made under a restrictive umask (0077 is common, and is this repo's own
    #     working default) leaves controller.yml mode 0600 and unreadable to uid
    #     998 — the sidecar would die with a confusing "permission denied" that
    #     depends on the operator's umask. Installing it as root removes host file
    #     modes from the equation and keeps the mount read-only.
    #
    # receptor itself never runs as root: setpriv drops to receptor(998) via exec,
    # so PID 1's child is unprivileged for the life of the container.
    #
    # Consequence for the dispatcher (Phase 5/7): the directory and the socket are
    # both owned by receptor(998) — the socket's own process — and are 0750/0600,
    # so the only identities that can reach the socket are receptor itself and
    # root. (Root-owning the directory would buy nothing: receptor must create,
    # and on restart replace, its socket there, so it needs write access to the
    # directory either way. The boundary being enforced is that NO OTHER uid can
    # reach it, not that receptor is kept out of its own runtime dir.)
    # `docker exec` runs as root, which is how
    # `make run` already works and how `make mesh-run` will, so this is consistent.
    # But an operator who SSHes into the controller as `ansible` (uid 1000, port
    # 2222) CANNOT dispatch: they get "Socket path does not exist", because 0750
    # hides the directory contents. If that path is ever needed, widen it
    # deliberately (group-owned socket at 0660), not by loosening this to 0666 —
    # write access to this socket is authority to run work on every node.
    user: "0:0"
    entrypoint: ["/usr/local/bin/dumb-init", "--", "/bin/sh", "-euc"]
    command:
      - |
        install -d -o receptor -g receptor -m 0750 /run/receptor
        install -o receptor -g receptor -m 0400 \
          /mnt/receptor/receptor.conf /etc/receptor/receptor.conf
        install -d -o receptor -g receptor -m 0750 /etc/receptor/tls
        install -o receptor -g receptor -m 0400 /mnt/receptor/tls/tls.key /etc/receptor/tls/tls.key
        install -o receptor -g receptor -m 0444 /mnt/receptor/tls/tls.crt /etc/receptor/tls/tls.crt
        install -o receptor -g receptor -m 0444 /mnt/receptor/tls/ca.crt  /etc/receptor/tls/ca.crt
        exec setpriv --reuid=receptor --regid=receptor --clear-groups \
          receptor -c /etc/receptor/receptor.conf
    # Ready means "the control socket answers", which is exactly what the
    # orchestrator needs — a listening TCP port would not prove the socket exists.
    healthcheck:
      test: ["CMD", "receptorctl", "--socket", "/run/receptor/receptor.sock", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  receptor-controller-b:
    # Identical to A except: identity controller-b, socket receptor-b.sock.
    # Same image pin; see the A block for the digest rationale.
    profiles: [mesh]
    image: quay.io/ansible/receptor:v1.6.7@sha256:6296f6cd3b0301cc7c9376e48ae15a42fc7b606235d08e94543fe77661cea4d2
    container_name: receptor-controller-b
    restart: unless-stopped
    # B's in-container listener is also 27199; published on host port 27200 so
    # both ingresses are reachable from outside. Same exposure rationale as A.
    ports:
      - "27200:27199"
    volumes:
      - ./mesh/config/receptor/controller-b.yml:/mnt/receptor/receptor.conf:ro
      - ./mesh/secrets/receptor/issued/controller-b:/mnt/receptor/tls:ro
      - receptor-runtime:/run/receptor
    user: "0:0"
    entrypoint: ["/usr/local/bin/dumb-init", "--", "/bin/sh", "-euc"]
    command:
      - |
        install -d -o receptor -g receptor -m 0750 /run/receptor
        install -o receptor -g receptor -m 0400 \
          /mnt/receptor/receptor.conf /etc/receptor/receptor.conf
        install -d -o receptor -g receptor -m 0750 /etc/receptor/tls
        install -o receptor -g receptor -m 0400 /mnt/receptor/tls/tls.key /etc/receptor/tls/tls.key
        install -o receptor -g receptor -m 0444 /mnt/receptor/tls/tls.crt /etc/receptor/tls/tls.crt
        install -o receptor -g receptor -m 0444 /mnt/receptor/tls/ca.crt  /etc/receptor/tls/ca.crt
        exec setpriv --reuid=receptor --regid=receptor --clear-groups \
          receptor -c /etc/receptor/receptor.conf
    healthcheck:
      test: ["CMD", "receptorctl", "--socket", "/run/receptor/receptor-b.sock", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Carries only the control socket between the sidecar and the controller. The
  # socket is the mesh's authority boundary, so it stays 0600 and never leaves
  # this volume (see mesh/config/receptor/controller.yml).
  receptor-runtime:
