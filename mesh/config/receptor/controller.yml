---
# Receptor config for the CONTROL-PLANE sidecar (mesh plan Phase 3).
#
# FORMAT: receptor 1.6.7 parses a YAML *list* of single-key action maps. The
# mapping style ("version: 2" with plural section names) is NOT accepted by this
# release — it fails with `cannot unmarshal !!map into []interface {}` — so keep
# this list shape when editing.

- node:
    # -a because Tier 1 (mesh plan Phase 6) adds controller-b as a second ingress;
    # execution nodes will peer to the list of both and redial.
    id: controller-a

- log-level:
    level: info

# The control service is the mesh's AUTHORITY BOUNDARY: anything able to write to
# it can submit work to every execution node. So it is a Unix socket only — no
# `tcplisten` — which means reaching it requires already being inside the
# orchestrator container, and the socket file itself stays owner-only.
#
# `permissions` is passed to the receptor CLI as an int and parsed by a YAML 1.1
# reader, so the leading zero is read as octal: 0600 -> rw for the owner alone.
# Verified on the running socket (srw------- receptor receptor).
- control-service:
    service: control
    filename: /run/receptor/receptor.sock
    permissions: 0600

# Backend listener that execution nodes dial in Phase 4 — nodes peer OUT to the
# controller, so only this side listens. It is deliberately NOT published to the
# host in compose.mesh.yml: until Phase 6 makes mTLS mandatory this listener is
# UNAUTHENTICATED and plaintext, so it must stay on the compose network only.
- tcp-listener:
    port: 27199
