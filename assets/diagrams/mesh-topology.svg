<svg id="my-svg" width="735.984375" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="281" viewBox="-8 -8 735.984375 281" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg" style="background-color: white;"><title id="chart-title-my-svg">Mesh topology and connection initiation</title><desc id="chart-desc-my-svg">Execution nodes in separate networks open outbound mutual TLS connections to ingress A on TCP 27199 and ingress B on TCP 27200. Both ingress endpoints and the orchestrator run on the control host. The orchestrator uses local sockets. Each node reaches its local targets over SSH or WinRM.</desc><style>#my-svg{font-family:Arial,sans-serif;font-size:16px;fill:#172b4d;}#my-svg .error-icon{fill:#f8fafc;}#my-svg .error-text{fill:#070503;stroke:#070503;}#my-svg .edge-thickness-normal{stroke-width:2px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#506580;stroke:#506580;}#my-svg .marker.cross{stroke:#506580;}#my-svg svg{font-family:Arial,sans-serif;font-size:16px;}#my-svg .label{font-family:Arial,sans-serif;color:#172b4d;}#my-svg .cluster-label text{fill:#070503;}#my-svg .cluster-label span,#my-svg p{color:#070503;}#my-svg .label text,#my-svg span,#my-svg p{fill:#172b4d;color:#172b4d;}#my-svg .node rect,#my-svg .node circle,#my-svg .node ellipse,#my-svg .node polygon,#my-svg .node path{fill:#eef4ff;stroke:#4972a7;stroke-width:1px;}#my-svg .flowchart-label text{text-anchor:middle;}#my-svg .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#my-svg .node .label{text-align:center;}#my-svg .node.clickable{cursor:pointer;}#my-svg .arrowheadPath{fill:#0b0b0b;}#my-svg .edgePath .path{stroke:#506580;stroke-width:2.0px;}#my-svg .flowchart-link{stroke:#506580;fill:none;}#my-svg .edgeLabel{background-color:#ffffff;text-align:center;}#my-svg .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#my-svg .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#my-svg .cluster rect{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1px;}#my-svg .cluster text{fill:#070503;}#my-svg .cluster span,#my-svg p{color:#070503;}#my-svg div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Arial,sans-serif;font-size:12px;background:#f8fafc;border:1px solid hsl(210, 0%, 88.0392156863%);border-radius:2px;pointer-events:none;z-index:100;}#my-svg .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#172b4d;}#my-svg .edgeLabel rect{opacity:1!important;}#my-svg :root{--mermaid-font-family:Arial,sans-serif;}#my-svg .execution rect{fill:rgb(237, 248, 242)!important;stroke:rgb(61, 129, 100)!important;color:rgb(20, 59, 43)!important;}#my-svg .execution polygon{fill:rgb(237, 248, 242)!important;stroke:rgb(61, 129, 100)!important;color:rgb(20, 59, 43)!important;}#my-svg .execution ellipse{fill:rgb(237, 248, 242)!important;stroke:rgb(61, 129, 100)!important;color:rgb(20, 59, 43)!important;}#my-svg .execution circle{fill:rgb(237, 248, 242)!important;stroke:rgb(61, 129, 100)!important;color:rgb(20, 59, 43)!important;}#my-svg .execution path{fill:rgb(237, 248, 242)!important;stroke:rgb(61, 129, 100)!important;color:rgb(20, 59, 43)!important;}#my-svg .execution tspan{fill:rgb(20, 59, 43)!important;}</style><g><marker id="my-svg_flowchart-pointEnd" class="marker flowchart" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-pointStart" class="marker flowchart" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-circleEnd" class="marker flowchart" viewBox="0 0 10 10" refX="11" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><circle cx="5" cy="5" r="5" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-circleStart" class="marker flowchart" viewBox="0 0 10 10" refX="-1" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><circle cx="5" cy="5" r="5" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-crossEnd" class="marker cross flowchart" viewBox="0 0 11 11" refX="12" refY="5.2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M 1,1 l 9,9 M 10,1 l -9,9" class="arrowMarkerPath" style="stroke-width: 2; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-crossStart" class="marker cross flowchart" viewBox="0 0 11 11" refX="-1" refY="5.2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M 1,1 l 9,9 M 10,1 l -9,9" class="arrowMarkerPath" style="stroke-width: 2; stroke-dasharray: 1, 0;"/></marker><g class="root"><g class="clusters"/><g class="edgePaths"><path d="M247.406,33.5L343.992,33.5L476.342,88.952" id="L-D-I-0" class="edge-thickness-normal edge-pattern-solid flowchart-link LS-D LE-I" style="fill:none;" marker-end="url(#my-svg_flowchart-pointEnd)"/><path d="M247.406,132.5L343.992,132.5L435.278,132.5" id="L-N-I-0" class="edge-thickness-normal edge-pattern-solid flowchart-link LS-N LE-I" style="fill:none;" marker-end="url(#my-svg_flowchart-pointEnd)"/><path d="M223.035,231.5L343.992,231.5L476.342,176.048" id="L-O-I-0" class="edge-thickness-normal edge-pattern-solid flowchart-link LS-O LE-I" style="fill:none;" marker-end="url(#my-svg_flowchart-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel" transform="translate(343.9921875, 33.5)"><g class="label" transform="translate(-61.3828125, -16.5)"><rect rx="0" ry="0" width="122.765625" height="33"/><text style=""><tspan xml:space="preserve" dy="1em" x="0" class="row">Outbound mTLS</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">to both endpoints</tspan></text></g></g><g class="edgeLabel" transform="translate(343.9921875, 132.5)"><g class="label" transform="translate(-61.3828125, -16.5)"><rect rx="0" ry="0" width="122.765625" height="33"/><text style=""><tspan xml:space="preserve" dy="1em" x="0" class="row">Outbound mTLS</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">to both endpoints</tspan></text></g></g><g class="edgeLabel" transform="translate(343.9921875, 231.5)"><g class="label" transform="translate(-70.5859375, -16.5)"><rect rx="0" ry="0" width="141.171875" height="33"/><text style=""><tspan xml:space="preserve" dy="1em" x="0" class="row">Local Unix sockets</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">primary and failover</tspan></text></g></g></g><g class="nodes"><g class="node default execution flowchart-label" id="flowchart-D-0" data-node="true" data-id="D" transform="translate(123.703125, 33.5)"><rect class="basic label-container" style="" rx="0" ry="0" x="-123.703125" y="-33.5" width="247.40625" height="67"/><g class="label" style="" transform="translate(0, -24.5)"><rect/><text style=""><tspan xml:space="preserve" dy="1em" x="0" class="row">DMZ NETWORK</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">Execution node · exec-dmz-a</tspan><tspan xml:space="preserve" dy="1em" x="0" class="row">Local targets via SSH or WinRM</tspan></text></g></g><g class="node default execution flowchart-label" id="flowchart-N-1" data-node="true" data-id="N" transform="translate(123.703125, 132.5)"><rect class="basic label-container" style="" rx="0" ry="0" x="-123.703125" y="-33.5" width="247.40625" height="67"/><g class="label" style="" transform="translate(0, -24.