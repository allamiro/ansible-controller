[defaults]
inventory = /configs/inventory/hosts.ini
retry_files_enabled = False
# SSH host-key checking — DEV DEFAULT is off, for convenience against ephemeral
# lab hosts whose keys change often. This is NOT production-safe: it disables
# SSH man-in-the-middle protection. For production set this to True and pin a
# managed known_hosts (see the [ssh_connection] block below and the README
# "SSH host-key checking" section). This insecure default is retained only for
# backward compatibility and is slated to flip to True in a future major release.
host_key_checking = False
log_path = /var/log/ansible/ansible.log
remote_user = ansible
forks = 20
timeout = 30
gathering = smart
# The community 'yaml' stdout callback was removed in ansible-core 2.19; the
# default callback renders YAML-formatted results via callback_result_format.
stdout_callback = default
callback_result_format = yaml
callbacks_enabled = profile_tasks
force_color = True
display_skipped_hosts = False
diff_always = True

# Vault: drop a password file at configs/.vault_pass (gitignored) or set the
# ANSIBLE_VAULT_PASSWORD env var on the container — the entrypoint exports
# ANSIBLE_VAULT_PASSWORD_FILE to SSH sessions automatically, so this setting
# usually stays commented. Uncomment only to hard-pin the file path:
# vault_password_file = /configs/.vault_pass

interpreter_python = auto_silent
fact_caching = ansible.builtin.jsonfile
fact_caching_connection = /configs/.facts_cache
cache_timeout = 3600

# Galaxy content from configs/requirements.yml lands under /configs/.galaxy/ (rw
# mount, host-persisted) — installed automatically at container start or via
# `make galaxy`. roles_path also keeps /configs/playbooks/roles so host-managed
# roles still resolve; /usr/share/ansible/collections holds the collections baked
# into the image (ansible.posix, community.general).
roles_path = /configs/playbooks/roles:/configs/.galaxy/roles:/usr/share/ansible/roles
collections_path = /configs/.galaxy/collections:/usr/share/ansible/collections

# Mitogen (opt-in): connection multiplexing that can cut playbook runtime
# significantly. The plugin is baked into the image on Ansible's default
# strategy search path, so enabling it is this one line. Leave disabled if
# you rely on strategy-sensitive plugins or the free strategy.
# strategy = mitogen_linear

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# DEV DEFAULT (pairs with host_key_checking = False above): skip host-key
# verification entirely. NOT production-safe — every host key is trusted blindly.
#
# Production-safe alternative — set host_key_checking = True above, then replace
# the ssh_args line below with a managed known_hosts:
#   ssh_args = -o UserKnownHostsFile=/configs/known_hosts -o StrictHostKeyChecking=yes
# Pre-populate it on the host (persisted via the ./configs mount) — but VERIFY
# the scanned fingerprints out-of-band first; ssh-keyscan over an untrusted
# network can capture an attacker's key (see README "SSH host-key checking"):
#   ssh-keyscan -H host1 host2 > /tmp/kh.new && ssh-keygen -lf /tmp/kh.new
#   # compare fingerprints against a trusted source, then:
#   cat /tmp/kh.new >> configs/known_hosts
# Or use StrictHostKeyChecking=accept-new to trust-on-first-use (records each key
# the first time, then detects changes) instead of pre-pinning every host.
ssh_args = -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
pipelining = True

[inventory]
cache = True
cache_connection = /configs/.inventory_cache

[colors]
diff_add    = bright cyan
diff_remove = bright red